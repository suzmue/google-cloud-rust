[package]
name = "pubsub-benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.29", features = ["full"] }
google-cloud-pubsub = { path = "../" }
futures = "0.3"
humantime = "2.1"
log = "0.4"
env_logger = "0.10"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["std"] }
serde_json = "1.0"
atomic-shim = "0.1"
